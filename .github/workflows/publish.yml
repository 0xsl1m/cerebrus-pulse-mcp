name: Publish to PyPI

# Publishes through PyPI Trusted Publishing (OIDC): no API token is stored
# anywhere, and pypa/gh-action-pypi-publish uploads provenance attestations.
# Runs when a vX.Y.Z tag is pushed (see scripts/release.py).
#
# One-time setup before the first run (repo owner):
#   1. On PyPI, add a trusted publisher to cerebrus-pulse-mcp: owner 0xsl1m,
#      repository cerebrus-pulse-mcp, workflow publish.yml, environment pypi.
#   2. In the repo settings, create the `pypi` environment. Adding a required
#      reviewer there makes every release wait for a human approval.
on:
  push:
    tags: ["v*"]

concurrency:
  group: pypi-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: verify + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify the release source
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          # Only commits already on main are released.
          git branch --remotes --contains "$GITHUB_SHA" | grep -Fxq "  origin/main"
          # The tag names the version in pyproject.toml...
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v$version" = "$TAG"
          # ...and __init__.py, CHANGELOG.md and server.json agree with it.
          python scripts/release.py check
      - name: Test
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/cerebrus-pulse-mcp
    permissions:
      actions: read
      contents: read
      id-token: write # Trusted Publishing (OIDC); no secrets are used
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
