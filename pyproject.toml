[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cerebrus-pulse-mcp"
version = "0.5.1"
description = "MCP server for Cerebrus Pulse — real-time crypto intelligence API for Hyperliquid perpetuals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "0xsl1m", email = "sl1m@ghost.love" },
]
keywords = [
    "mcp", "crypto", "technical-analysis", "hyperliquid", "x402",
    "ai-agent", "cerebrus-pulse", "trading", "micropayments",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # mcp 2.x removed the lowlevel Server.list_tools()/call_tool() decorators
    # this server registers at import time; stay on the maintained 1.x line.
    "mcp>=1.2,<2",
    "httpx>=0.27.0",
    # x402 auto-payment. Core, not an extra: uvx and the MCP registry install
    # the bare package into an isolated env, so an optional extra never
    # reached the documented setups and paid tools could not pay.
    "x402[evm]>=2.20,<3",  # 2.20 added client spend_controls
    "eth-account>=0.13",
    "requests>=2.32",
]

[project.optional-dependencies]
# Kept as an empty alias so `pip install "cerebrus-pulse-mcp[pay]"` (documented
# for 0.5.0-0.5.1) keeps resolving; the payment deps are core since 0.5.2.
pay = []
test = [
    "pytest>=8",
    "jsonschema>=4",
]

[project.urls]
Homepage = "https://cerebruspulse.xyz"
Documentation = "https://cerebruspulse.xyz/overview"
Repository = "https://github.com/0xsl1m/cerebrus-pulse-mcp"
Issues = "https://github.com/0xsl1m/cerebrus-pulse-mcp/issues"

[project.scripts]
cerebrus-pulse-mcp = "cerebrus_pulse_mcp.server:main"
